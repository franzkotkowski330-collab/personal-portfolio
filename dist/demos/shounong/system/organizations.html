<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <title>组织管理 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const page = renderLayout({
      activeKey: 'sys-orgs',
      breadcrumb: [{ label: '系统管理' }, { label: '组织管理' }]
    });

    function renderTree(items, level) {
      return items.map((it, i) => {
        const last = i === items.length - 1;
        const hasChildren = it.children && it.children.length > 0;
        return `
          <div class="org-node" style="padding-left:${level * 24}px">
            <div class="flex-center gap-8" style="padding:8px 12px;border-radius:6px;background:${level === 0 ? 'var(--primary-light)' : level === 1 ? 'var(--bg-soft)' : '#fff'};margin-bottom:4px;border:1px solid var(--border)">
              <span style="color:var(--primary);font-size:14px">${level === 0 ? '🏢' : level === 1 ? '🏛️' : level === 2 ? '🏭' : '👥'}</span>
              <b>${it.name}</b>
              <span class="tag tag-grey">${it.type}</span>
              ${it.users ? `<span class="text-3" style="font-size:12px">${it.users} 人</span>` : ''}
              <span class="filter-spacer" style="flex:1"></span>
              <button class="btn-text">+ 子节点</button>
              <button class="btn-text">编辑</button>
              ${level > 0 ? '<button class="btn-text danger">停用</button>' : ''}
            </div>
            ${hasChildren ? renderTree(it.children, level + 1) : ''}
          </div>`;
      }).join('');
    }

    page.innerHTML = `
      <div class="query-card">
        <div class="query-fields">
          <span class="query-field q-w-lg">
            <label>组织名称</label>
            <input type="text" placeholder="请输入" />
          </span>
        </div>
        <div class="query-actions">
          <button class="btn">重置</button>
          <button class="btn btn-primary">查询</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <span class="text-3">共 ${MOCK.orgs.length} 条</span>
          <div class="flex gap-8">
            <button class="btn" onclick="toast('配置列表字段', 'info')">配置列表字段</button>
            <button class="btn btn-primary">新增</button>
          </div>
        </div>
        ${renderTree(MOCK.orgs, 0)}
        <div class="pagination-v2">
          <span class="pagination-total">共 ${MOCK.orgs.length} 条</span>
          <select class="pagination-size"><option>100条/页</option><option>200条/页</option><option>300条/页</option><option>400条/页</option></select>
          <button disabled>«</button><button disabled>‹</button><button class="active">1</button><button>›</button><button>»</button>
          <span class="pagination-jumper">跳至 <input type="number" min="1" value="1" /> 页</span>
        </div>
      </div>
    `;
  </script>
</body>
</html>
