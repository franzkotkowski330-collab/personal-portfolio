<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-hero">
      <div class="login-hero-logo">
        <span style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#4096ff,#1677ff);display:inline-flex;align-items:center;justify-content:center;font-weight:700">阿</span>
        <span>阿洛酮糖生产平台</span>
      </div>
      <div>
        <div class="login-hero-title">系统管理<br/>登录入口</div>
        <div class="login-hero-desc">PRD 3.8.2 · 账号密码登录 · 连续失败 5 次锁定 15 分钟 · 首次登录强制改密</div>
      </div>
      <div class="login-hero-meta">系统管理模块 · login.html</div>
    </div>
    <div class="login-form">
      <h2>账号登录</h2>
      <div class="sub">请使用工号或用户名登录系统</div>
      <form id="login-form" onsubmit="return doLogin(event)">
        <div class="form-item">
          <label class="form-label">用户名 / 工号</label>
          <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" />
        </div>
        <div class="form-item">
          <label class="form-label">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <div class="options">
          <label><input type="checkbox" /> 记住登录状态（30分钟内）</label>
          <a href="#">忘记密码？</a>
        </div>
        <button type="submit" class="login-btn">登 录</button>
      </form>
      <div class="quick-login">
        快速以下方角色体验：
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
          <button type="button" onclick="quickLogin('王尚革','系统管理员', true)">系统管理员</button>
          <button type="button" onclick="quickLogin('张三','操作人员（发酵工段）')">发酵工段</button>
          <button type="button" onclick="quickLogin('李四','操作人员（中间体1）')">中间体检验</button>
          <button type="button" onclick="quickLogin('王五','质检科人员')">质检科</button>
          <button type="button" onclick="quickLogin('赵六','班组长')">班组长</button>
          <button type="button" onclick="quickLogin('刘七','生产管理人员')">生产管理</button>
        </div>
      </div>
      <div style="margin-top:16px;text-align:center;font-size:12px;color:#94a3b8">
        <a href="index.html">系统管理导航</a> · <a href="../login.html">门户登录页</a>
      </div>
    </div>
  </div>

  <script>
    function doLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      if (!u) { alert('请输入用户名'); return false; }
      localStorage.setItem('userName', u);
      localStorage.setItem('role', '系统管理员');
      localStorage.setItem('mustChangePassword', '1');
      location.href = 'change-password.html';
      return false;
    }
    function quickLogin(name, role, asAdmin) {
      localStorage.setItem('userName', name);
      localStorage.setItem('role', role);
      if (asAdmin) {
        localStorage.removeItem('mustChangePassword');
        location.href = 'index.html';
      } else {
        location.href = '../index.html';
      }
    }
  </script>
</body>
</html>
