<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密码 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="login-page">
  <div class="login-card" style="max-width:480px;margin:auto">
    <div class="login-form" style="width:100%;padding:40px 48px">
      <h2>修改密码</h2>
      
      <div class="sub">首次登录或管理员重置密码后，须修改密码方可进入系统</div>

      <div class="card" style="background:var(--warning-light);border-left:4px solid var(--warning);margin:16px 0;padding:12px 16px;box-shadow:none">
        <div style="font-size:13px;line-height:1.6;color:var(--text-2)">
          密码要求：长度 8~20 位，须包含字母和数字，不可与最近 3 次密码相同
        </div>
      </div>

      <form id="pwd-form" onsubmit="return submitPwd(event)">
        <div class="form-item">
          <label class="form-label"><span class="required">*</span> 当前密码</label>
          <input id="old-pwd" type="password" placeholder="请输入当前密码" />
        </div>
        <div class="form-item">
          <label class="form-label"><span class="required">*</span> 新密码</label>
          <input id="new-pwd" type="password" placeholder="8~20位，含字母和数字" oninput="checkStrength()" />
          
          <div id="pwd-hint" class="form-help"></div>
        </div>
        <div class="form-item">
          <label class="form-label"><span class="required">*</span> 确认新密码</label>
          <input id="confirm-pwd" type="password" placeholder="再次输入新密码" />
        </div>
        <button type="submit" class="login-btn">确认修改并进入系统</button>
      </form>
      
      <div style="margin-top:16px;text-align:center;font-size:12px;color:#94a3b8">
        <a href="login.html">返回登录</a> · <a href="index.html">系统管理</a>
      </div>
    </div>
  </div>

  <script>
    function checkStrength() {
      const v = document.getElementById('new-pwd').value;
      const hint = document.getElementById('pwd-hint');
      if (!v) { hint.textContent = ''; return; }
      const okLen = v.length >= 8 && v.length <= 20;
      const okMix = /[A-Za-z]/.test(v) && /\d/.test(v);
      if (okLen && okMix) {
        hint.textContent = '✓ 符合密码策略';
        hint.style.color = 'var(--success)';
      } else {
        hint.textContent = '需 8~20 位且同时包含字母与数字';
        hint.style.color = 'var(--danger)';
      }
    }

    function submitPwd(e) {
      e.preventDefault();
      const np = document.getElementById('new-pwd').value;
      const cp = document.getElementById('confirm-pwd').value;
      if (np !== cp) { alert('两次输入的新密码不一致'); return false; }
      if (np.length < 8 || np.length > 20 || !/[A-Za-z]/.test(np) || !/\d/.test(np)) {
        alert('新密码不符合策略要求'); return false;
      }
      localStorage.removeItem('mustChangePassword');
      alert('密码修改成功');
      location.href = 'index.html';
      return false;
    }
  </script>
</body>
</html>
