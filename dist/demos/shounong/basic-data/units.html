<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <title>单位管理 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <div id="app"></div>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const page = renderLayout({
      activeKey: 'basic-units',
      breadcrumb: [{ label: '基础数据管理' }, { label: '单位管理' }]
    });
    page.innerHTML = `
      <div class="card">
        <div class="flex-between mb-12">
          <div class="text-2">单位字典统一维护，避免硬编码</div>
          <button class="btn btn-primary">+ 新增单位</button>
        </div>
        <table class="table">
          <thead><tr><th>单位</th><th>显示名</th><th>说明</th><th>启用</th><th class="col-actions">操作</th></tr></thead>
          <tbody>
            ${(MOCK.units || []).map(s => `
              <tr>
                <td><a class="text-primary fw-500" href="unit-detail.html?name=${encodeURIComponent(s.name)}">${s.name}</a></td>
                <td>${s.display}</td><td>${s.desc}</td>
                <td><div class="switch ${s.enabled ? 'on' : ''}"></div></td>
                <td class="col-actions">
                  <button class="btn-text" onclick="location.href='unit-detail.html?name=${encodeURIComponent(s.name)}'">查看</button>
                  <button class="btn-text">编辑</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
`;
  </script>
</body>
</html>
