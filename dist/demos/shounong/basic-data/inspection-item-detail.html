<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>检验项目详情 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    .modal {
      width: 560px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const ITEM_STORAGE_KEY = 'basicData.inspectionItems.v1';
    const ITEM_LOG_STORAGE_KEY = 'basicData.inspectionItemLogs.v1';
    const DATA_TYPES = ['数值型', '文本型', '布尔型'];
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || 'PH';

    let itemList = loadItemList();
    let itemLogs = loadItemLogs();

    const page = renderLayout({
      activeKey: 'basic-inspection-items',
      breadcrumb: [{ label: '基础数据管理' }, { label: '检验项目管理' }, { label: name }]
    });

    function loadItemList() {
      try {
        const saved = JSON.parse(localStorage.getItem(ITEM_STORAGE_KEY) || 'null');
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      return (MOCK.inspectionItemManagementList || []).map(row => ({ ...row }));
    }

    function saveItemList() {
      localStorage.setItem(ITEM_STORAGE_KEY, JSON.stringify(itemList));
    }

    function loadItemLogs() {
      try {
        const saved = JSON.parse(localStorage.getItem(ITEM_LOG_STORAGE_KEY) || '{}');
        return { ...(MOCK.inspectionItemManagementLogs || {}), ...(saved || {}) };
      } catch (e) {
        return { ...(MOCK.inspectionItemManagementLogs || {}) };
      }
    }

    function saveItemLogs() {
      localStorage.setItem(ITEM_LOG_STORAGE_KEY, JSON.stringify(itemLogs));
    }

    function currentUser() {
      return localStorage.getItem('userName') || '王尚革';
    }

    function nowText() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function getRow() {
      return itemList.find(row => row.name === name);
    }

    function dataTypeTag(dataType) {
      const cls = dataType === '数值型' ? 'tag-blue' : dataType === '文本型' ? 'tag-orange' : 'tag-green';
      return `<span class="tag ${cls}">${escapeHtml(dataType)}</span>`;
    }

    function appendLog(itemName, log) {
      itemLogs[itemName] = itemLogs[itemName] || [];
      itemLogs[itemName].unshift(log);
      saveItemLogs();
    }

    function collectDiff(oldRow, nextRow) {
      const fields = [
        { key: 'name', label: '项目名称' },
        { key: 'dataType', label: '数据类型' },
        { key: 'enabled', label: '状态', format: v => v ? '启用' : '停用' }
      ];
      return fields
        .filter(f => oldRow[f.key] !== nextRow[f.key])
        .map(f => ({
          field: f.label,
          old: f.format ? f.format(oldRow[f.key]) : oldRow[f.key],
          new: f.format ? f.format(nextRow[f.key]) : nextRow[f.key]
        }));
    }

    function getLogs(row) {
      const logs = itemLogs[name] || [];
      if (logs.length) return logs;
      if (!row) return [];
      return [{
        time: row.createdAt || '—',
        user: row.creator || '—',
        action: '创建',
        type: 'create'
      }];
    }

    function logClass(op) {
      if (op.type === 'create' || op.action.includes('创建')) return 'create';
      if (op.type === 'delete' || op.action.includes('删除')) return 'reject';
      if (op.type === 'edit' || op.action.includes('编辑')) return '';
      return '';
    }

    function renderOperationLog(row) {
      const logs = getLogs(row);
      if (!logs.length) return '<div class="empty" style="padding:32px">暂无操作记录</div>';
      return `
        <ul class="oplog-list">
          ${logs.map((op, idx) => {
            const hasDiff = op.diff && op.diff.length;
            return `
              <li class="oplog-item ${logClass(op)}">
                <div class="oplog-head">
                  <span class="time">${escapeHtml(op.time)}</span>
                  <span class="user">${escapeHtml(op.user)}</span>
                  <span class="action">· ${escapeHtml(op.action)}</span>
                  ${hasDiff ? `<span class="summary">变更了 ${op.diff.length} 个字段</span>` : ''}
                  ${hasDiff ? `<span class="toggle" onclick="toggleDiff(${idx})">展开 ▾</span>` : ''}
                </div>
                ${hasDiff ? `
                  <div class="oplog-detail" id="diff-${idx}">
                    ${op.diff.map(d => `
                      <div class="oplog-diff-row">
                        <span class="field">${escapeHtml(d.field)}</span>
                        <span class="old">${escapeHtml(d.old)}</span>
                        <span class="arrow">→</span>
                        <span class="new">${escapeHtml(d.new)}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </li>
            `;
          }).join('')}
        </ul>
      `;
    }

    function render() {
      const row = getRow();
      if (!row) {
        page.innerHTML = `
          <div class="card">
            <div class="card-header"><div class="card-title">操作记录</div></div>
            ${renderOperationLog(row)}
          </div>
        `;
        return;
      }

      page.innerHTML = `
        <div class="detail-page-stack"><div class="card">
              <div class="card-header"><div class="card-title">基础信息</div></div>
              <div class="detail-meta">
                <div class="detail-meta-item"><div class="lbl">项目名称</div><div class="val">${escapeHtml(row.name)}</div></div>
                <div class="detail-meta-item"><div class="lbl">数据类型</div><div class="val">${dataTypeTag(row.dataType)}</div></div>
                <div class="detail-meta-item"><div class="lbl">状态</div><div class="val">${row.enabled ? '启用' : '停用'}</div></div>
                <div class="detail-meta-item"><div class="lbl">创建人</div><div class="val">${escapeHtml(row.creator || '—')}</div></div>
                <div class="detail-meta-item"><div class="lbl">创建时间</div><div class="val">${escapeHtml(row.createdAt || '—')}</div></div>
                <div class="detail-meta-item"><div class="lbl">最近编辑人</div><div class="val">${escapeHtml(row.updatedBy || row.creator || '—')}</div></div>
                <div class="detail-meta-item"><div class="lbl">最近编辑时间</div><div class="val">${escapeHtml(row.updatedAt || row.createdAt || '—')}</div></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title">操作记录 <span class="text-3" style="font-weight:400;font-size:12px">（创建、编辑记录按时间倒序）</span></div>
              </div>
              ${renderOperationLog(row)}
            </div>

            <div class="card" style="background:var(--info-light);box-shadow:none">
              <div style="font-weight:600;color:var(--info);margin-bottom:8px">数据用途</div>
              <div class="text-2" style="font-size:13px;line-height:1.8">
                检验项目基础数据定义项目名称与数据类型。<br/>
                具体上下限、标准描述和适用工序仍在【质检模板配置】中维护。
              </div>
            </div>
        </div>
      `;
    }

    window.toggleDiff = function (idx) {
      const el = document.getElementById('diff-' + idx);
      if (el) el.classList.toggle('open');
    };

    window.openItemEditor = function () {
      const row = getRow();
      if (!row) {
        toast('未找到检验项目', 'error');
        return;
      }
      confirmDialog(
        '编辑检验项目',
        `
          <div class="form-row" style="grid-template-columns:1fr 1fr">
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 项目名称</label>
              <input id="form-name" type="text" value="${escapeHtml(row.name)}" />
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 数据类型</label>
              <select id="form-data-type">
                ${DATA_TYPES.map(type => `<option value="${escapeHtml(type)}" ${row.dataType === type ? 'selected' : ''}>${escapeHtml(type)}</option>`).join('')}
              </select>
            </div>
            <div class="form-item">
              <label class="form-label">状态</label>
              <select id="form-enabled">
                <option value="true" ${row.enabled ? 'selected' : ''}>启用</option>
                <option value="false" ${!row.enabled ? 'selected' : ''}>停用</option>
              </select>
            </div>
          </div>
        `,
        () => {
          const next = {
            ...row,
            name: document.getElementById('form-name').value.trim(),
            dataType: document.getElementById('form-data-type').value,
            enabled: document.getElementById('form-enabled').value === 'true'
          };
          if (!next.name || !next.dataType) {
            toast('请填写项目名称和数据类型', 'error');
            return false;
          }
          const duplicate = itemList.some(item => item.name === next.name && item.name !== name);
          if (duplicate) {
            toast('项目名称已存在，请更换名称', 'error');
            return false;
          }
          const diff = collectDiff(row, next);
          const idx = itemList.findIndex(item => item.name === name);
          if (diff.length) {
            const time = nowText();
            const user = currentUser();
            itemList[idx] = { ...next, updatedBy: user, updatedAt: time };
            if (next.name !== name && itemLogs[name]) {
              itemLogs[next.name] = itemLogs[name];
              delete itemLogs[name];
            }
            saveItemList();
            appendLog(next.name, { time, user, action: '编辑保存', type: 'edit', diff });
          }
          toast(diff.length ? '已保存检验项目修改' : '未发现字段变更', diff.length ? 'success' : 'warning');
          if (next.name !== name) {
            setTimeout(() => location.href = './inspection-item-detail.html?name=' + encodeURIComponent(next.name), 500);
          } else {
            render();
          }
        },
        '保存'
      );
    };

    window.confirmDelete = function () {
      const row = getRow();
      if (!row) {
        toast('未找到检验项目', 'error');
        return;
      }
      confirmDialog('删除检验项目', `确定删除检验项目 <b>${escapeHtml(row.name)}</b>？`, () => {
        itemList = itemList.filter(item => item.name !== name);
        saveItemList();
        appendLog(name, {
          time: nowText(),
          user: currentUser(),
          action: '删除',
          type: 'delete',
          diff: [{ field: '检验项目', old: row.name, new: '已删除' }]
        });
        toast('已删除检验项目', 'success');
        setTimeout(() => location.href = './inspection-items.html', 600);
      }, '删除');
    };

    render();
  </script>
</body>
</html>
