<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>辅料管理 - 阿洛酮糖生产管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    .modal {
      width: 620px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../assets/js/menu.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const AUX_STORAGE_KEY = 'basicData.auxiliaryMaterials.v1';
    const AUX_LOG_STORAGE_KEY = 'basicData.auxiliaryMaterialLogs.v1';

    let filters = { keyword: '', process: '', enabled: '' };
    let auxList = loadAuxList();
    let auxLogs = loadAuxLogs();

    // 列配置管理
    const allColumns = [
      { key: 'code', label: '辅料编码' },
      { key: 'name', label: '辅料名称' },
      { key: 'manufacturer', label: '生产厂家' },
      { key: 'process', label: '使用工序' }
    ];
    const columnManager = createColumnManager('basicData.auxiliaryMaterials.columns', allColumns);

    const page = renderLayout({
      activeKey: 'basic-auxiliary-materials',
      breadcrumb: [{ label: '基础数据管理' }, { label: '辅料管理' }]
    });

    function loadAuxList() {
      try {
        const saved = JSON.parse(localStorage.getItem(AUX_STORAGE_KEY) || 'null');
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      return (MOCK.auxiliaryMaterialList || []).map(row => ({ ...row }));
    }

    function saveAuxList() {
      localStorage.setItem(AUX_STORAGE_KEY, JSON.stringify(auxList));
    }

    function loadAuxLogs() {
      try {
        const saved = JSON.parse(localStorage.getItem(AUX_LOG_STORAGE_KEY) || '{}');
        return { ...(MOCK.auxiliaryMaterialLogs || {}), ...(saved || {}) };
      } catch (e) {
        return { ...(MOCK.auxiliaryMaterialLogs || {}) };
      }
    }

    function saveAuxLogs() {
      localStorage.setItem(AUX_LOG_STORAGE_KEY, JSON.stringify(auxLogs));
    }

    function currentUser() {
      return localStorage.getItem('userName') || '王尚革';
    }

    function nowText() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function getProcesses() {
      return [...new Set(auxList.map(row => row.process).filter(Boolean))];
    }

    function nextCode() {
      const nums = auxList.map(row => Number(row.code)).filter(n => Number.isFinite(n));
      return String((nums.length ? Math.max(...nums) : 0) + 1);
    }

    function getFilteredList() {
      const keyword = filters.keyword.trim().toLowerCase();
      return auxList.filter(row => {
        const hitKeyword = !keyword
          || row.code.toLowerCase().includes(keyword)
          || row.name.toLowerCase().includes(keyword)
          || row.manufacturer.toLowerCase().includes(keyword)
          || row.process.toLowerCase().includes(keyword);
        const hitProcess = !filters.process || row.process === filters.process;
        const hitEnabled = !filters.enabled || String(row.enabled) === filters.enabled;
        return hitKeyword && hitProcess && hitEnabled;
      }).slice().sort((a, b) => Number(a.code) - Number(b.code));
    }

    function render() {
      const list = getFilteredList();
      const processes = getProcesses();
      const visibleCols = columnManager.getVisibleColumns();

      page.innerHTML = `
        <div class="card">
          <div class="filter-bar">
            <span class="query-field q-w-xl"><label><b>关键词:</b></label><input id="keyword" type="text" placeholder="编码 / 名称 / 厂家 / 工序" value="${escapeHtml(filters.keyword)}" /></span>
            <span class="query-field q-w-lg"><label><b>使用工序:</b></label><select id="process">
              <option value="">全部</option>
              ${processes.map(process => `<option value="${escapeHtml(process)}" ${filters.process === process ? 'selected' : ''}>${escapeHtml(process)}</option>`).join('')}
            </select></span>
            <span class="query-field q-w-sm"><label><b>状态:</b></label><select id="enabled">
              <option value="">全部</option>
              <option value="true" ${filters.enabled === 'true' ? 'selected' : ''}>启用</option>
              <option value="false" ${filters.enabled === 'false' ? 'selected' : ''}>停用</option>
            </select></span>
            <span class="filter-actions">
              <button class="btn" onclick="resetFilters()">重置</button>
            <button class="btn btn-primary" onclick="applyFilters()">查询</button>
            </span>
          </div>
        </div>

        <div class="card">
          <div class="table-toolbar">
            <span class="text-3">共 ${list.length} 条</span>
            <div class="table-toolbar-right">
              <button class="btn" onclick="openColumnConfig()">配置列表字段</button>
              <button class="btn" onclick="exportList()">导出</button>
              <button class="btn btn-primary" onclick="openAuxEditor()">新增</button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  ${visibleCols.map(col => `<th>${col.label}</th>`).join('')}
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody>
                ${list.length ? list.map(row => `
                  <tr>
                    ${visibleCols.map(col => {
                      if (col.key === 'code') {
                        return `<td><a class="text-primary fw-500" href="./auxiliary-material-detail.html?code=${encodeURIComponent(row.code)}">${escapeHtml(row.code)}</a></td>`;
                      } else if (col.key === 'name') {
                        return `<td>${escapeHtml(row.name)}</td>`;
                      } else {
                        return `<td>${escapeHtml(row[col.key] || '—')}</td>`;
                      }
                    }).join('')}
                    <td class="col-actions">
                      <button class="btn-text" onclick="location.href='./auxiliary-material-detail.html?code=${encodeURIComponent(row.code)}'">查看</button>
                      <button class="btn-text" onclick="openAuxEditor('${escapeHtml(row.code)}')">编辑</button>
                      <button class="btn-text danger" onclick="confirmDelete('${escapeHtml(row.code)}')">删除</button>
                    </td>
                  </tr>
                `).join('') : `
                  <tr><td colspan="5"><div class="empty" style="padding:32px">暂无符合条件的辅料数据</div></td></tr>
                `}
              </tbody>
            </table>
          </div>

          <div class="pagination-v2">
            <span class="pagination-total">共 ${list.length} 条</span>
            <select class="pagination-size"><option>100条/页</option><option>200条/页</option><option>300条/页</option><option>400条/页</option></select>
            <button disabled>&laquo;</button><button disabled>&lsaquo;</button><button class="active">1</button><button>&rsaquo;</button><button>&raquo;</button>
            <span class="pagination-jumper">跳至 <input type="number" min="1" value="1" /> 页</span>
          </div>
        </div>
      `;
    }

    window.applyFilters = function () {
      filters = {
        keyword: document.getElementById('keyword').value,
        process: document.getElementById('process').value,
        enabled: document.getElementById('enabled').value
      };
      render();
    };

    window.resetFilters = function () {
      filters = { keyword: '', process: '', enabled: '' };
      render();
    };

    window.exportList = function () {
      toast('已导出辅料管理列表', 'success');
    };

    window.openColumnConfig = function() {
      columnManager.openConfig(() => render());
    };

    function appendLog(code, log) {
      auxLogs[code] = auxLogs[code] || [];
      auxLogs[code].unshift(log);
      saveAuxLogs();
    }

    function collectDiff(oldRow, nextRow) {
      const fields = [
        { key: 'name', label: '辅料名称' },
        { key: 'manufacturer', label: '生产厂家' },
        { key: 'process', label: '使用工序' },
        { key: 'enabled', label: '状态', format: v => v ? '启用' : '停用' }
      ];
      return fields
        .filter(f => oldRow[f.key] !== nextRow[f.key])
        .map(f => ({
          field: f.label,
          old: f.format ? f.format(oldRow[f.key]) : oldRow[f.key],
          new: f.format ? f.format(nextRow[f.key]) : nextRow[f.key]
        }));
    }

    window.openAuxEditor = function (code) {
      const editing = !!code;
      const row = editing
        ? auxList.find(item => item.code === code)
        : { code: nextCode(), name: '', manufacturer: '', process: '', enabled: true };
      if (!row) {
        toast('未找到辅料数据', 'error');
        return;
      }

      const processOptions = [...new Set([...(MOCK.processManagementList || []).map(p => p.name), ...getProcesses()])];
      confirmDialog(
        editing ? '编辑辅料' : '新增辅料',
        `
          <div class="form-row" style="grid-template-columns:1fr 1fr">
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 辅料编码</label>
              <input id="form-code" type="text" ${editing ? 'readonly' : ''} value="${escapeHtml(row.code)}" placeholder="如 4" />
              <div class="form-help">作为唯一标识，保存后不建议变更</div>
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 辅料名称</label>
              <input id="form-name" type="text" value="${escapeHtml(row.name)}" placeholder="如 硫酸锰" />
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 生产厂家</label>
              <input id="form-manufacturer" type="text" value="${escapeHtml(row.manufacturer)}" placeholder="如 江苏科伦多食品配料有限公司" />
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 使用工序</label>
              <input id="form-process" type="text" list="process-options" value="${escapeHtml(row.process)}" placeholder="如 异构" />
              <datalist id="process-options">
                ${processOptions.map(process => `<option value="${escapeHtml(process)}"></option>`).join('')}
              </datalist>
            </div>
            <div class="form-item">
              <label class="form-label">状态</label>
              <select id="form-enabled">
                <option value="true" ${row.enabled ? 'selected' : ''}>启用</option>
                <option value="false" ${!row.enabled ? 'selected' : ''}>停用</option>
              </select>
            </div>
          </div>
        `,
        () => {
          const next = {
            code: document.getElementById('form-code').value.trim(),
            name: document.getElementById('form-name').value.trim(),
            manufacturer: document.getElementById('form-manufacturer').value.trim(),
            process: document.getElementById('form-process').value.trim(),
            enabled: document.getElementById('form-enabled').value === 'true'
          };

          if (!next.code || !next.name || !next.manufacturer || !next.process) {
            toast('请填写辅料编码、名称、生产厂家和使用工序', 'error');
            return false;
          }

          const user = currentUser();
          const time = nowText();
          if (editing) {
            const idx = auxList.findIndex(item => item.code === code);
            const oldRow = auxList[idx];
            const nextRow = { ...oldRow, ...next };
            const diff = collectDiff(oldRow, nextRow);
            if (diff.length) {
              auxList[idx] = { ...nextRow, updatedBy: user, updatedAt: time };
              saveAuxList();
              appendLog(code, { time, user, action: '编辑保存', type: 'edit', diff });
            }
            toast(diff.length ? '已保存辅料修改' : '未发现字段变更', diff.length ? 'success' : 'warning');
          } else {
            if (auxList.some(item => item.code === next.code)) {
              toast('辅料编码已存在，请更换编码', 'error');
              return false;
            }
            const newRow = {
              ...next,
              creator: user,
              createdAt: time,
              updatedBy: user,
              updatedAt: time
            };
            auxList.unshift(newRow);
            saveAuxList();
            appendLog(next.code, { time, user, action: '创建', type: 'create' });
            toast('已新增辅料', 'success');
          }
          render();
        },
        editing ? '保存' : '新增'
      );
    };

    window.confirmDelete = function (code) {
      const row = auxList.find(item => item.code === code);
      if (!row) {
        toast('未找到辅料数据', 'error');
        return;
      }
      confirmDialog('删除辅料', `确定删除辅料 <b>${escapeHtml(row.code)} - ${escapeHtml(row.name)}</b>？`, () => {
        auxList = auxList.filter(item => item.code !== code);
        saveAuxList();
        appendLog(code, {
          time: nowText(),
          user: currentUser(),
          action: '删除',
          type: 'delete',
          diff: [{ field: '辅料', old: `${row.code} - ${row.name}`, new: '已删除' }]
        });
        toast('已删除辅料', 'success');
        render();
      }, '删除');
    };

    render();
  </script>
</body>
</html>
