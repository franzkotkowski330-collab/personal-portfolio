name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Check static entry and resume
        run: |
          test -s dist/index.html
          test -s dist/assets/xiaolanzhi-resume.pdf
          test -s dist/demos/shounong/basic-data/dictionaries.html
          test -s dist/demos/shanghai-electric/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
